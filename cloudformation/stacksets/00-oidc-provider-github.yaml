AWSTemplateFormatVersion: '2010-09-09'
Description: |
  GitHub Actions OIDC Provider - Foundation StackSet

  Deploy ONCE via StackSet from management account.
  Creates the OIDC identity provider for GitHub Actions in target accounts.

  This is a one-time foundational resource - no state management needed.
  CloudFormation StackSets is the ideal tool for this.

Parameters:
  GitHubOrganization:
    Type: String
    Description: GitHub organization name (e.g., zsoftly)
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    ConstraintDescription: Must be a valid GitHub organization name

  ThumbprintList:
    Type: CommaDelimitedList
    Description: GitHub OIDC thumbprints (rarely changes)
    Default: '6938fd4d98bab03faadb97b34396831e3780aea1,1c58a3a8518e8759bf075b76b750d4f2df264fcd'

# Note: Repository restrictions are enforced in IAM role trust policies (10-iam-cicd-roles.yaml),
# not in the OIDC provider itself.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: GitHub Configuration
        Parameters:
          - GitHubOrganization
          - ThumbprintList
    ParameterLabels:
      GitHubOrganization:
        default: GitHub Organization

Resources:
  # ==========================================================================
  # OIDC Identity Provider
  # ==========================================================================
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList: !Ref ThumbprintList
      Tags:
        - Key: Name
          Value: github-actions-oidc
        - Key: Purpose
          Value: cicd-authentication
        - Key: ManagedBy
          Value: cloudformation-stackset
        - Key: Foundation
          Value: 'true'

Outputs:
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'

  OIDCProviderUrl:
    Description: URL of the OIDC Provider
    Value: https://token.actions.githubusercontent.com
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderUrl'

  GitHubOrganization:
    Description: Configured GitHub organization
    Value: !Ref GitHubOrganization
    Export:
      Name: !Sub '${AWS::StackName}-GitHubOrganization'
