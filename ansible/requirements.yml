---
# requirements.yml - Ansible Galaxy requirements
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-galaxy role install -r requirements.yml

collections:
  # AWS support
  - name: amazon.aws
    version: ">=7.0.0"

  # General utilities
  - name: community.general
    version: ">=8.0.0"

  # POSIX utilities (sysctl, etc.)
  - name: ansible.posix
    version: ">=1.5.0"

